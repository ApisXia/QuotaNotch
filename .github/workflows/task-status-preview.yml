name: Task status visual preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Render production glyph comparison
        run: bash scripts/render-task-status.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Task-status-design-${{ github.sha }}
          path: build/task-status-output/*
          if-no-files-found: error
