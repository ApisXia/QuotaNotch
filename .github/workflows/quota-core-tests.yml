name: Quota core regression tests

on:
  workflow_dispatch:
  push:
    branches: ['feature/bubble-native-material']
    paths:
      - 'QuotaNotch/Core/**'
      - 'QuotaNotchTests/**'
      - 'Package.swift'
      - '.github/workflows/quota-core-tests.yml'

permissions:
  contents: read

concurrency:
  group: quota-core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Run core and fake credential process tests
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee quota-core-tests.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Quota-core-tests-${{ github.sha }}
          path: quota-core-tests.log
          if-no-files-found: ignore
