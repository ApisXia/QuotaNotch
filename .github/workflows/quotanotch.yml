name: QuotaNotch macOS app

on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: Render the original/refined comparison without building an installer
        type: boolean
        default: false
  push:
    branches: ['feature/quotanotch-ai-usage', main, future, 'feature/notch-cat']
  pull_request:
    branches: [main, dev]
    paths:
      - 'QuotaNotch/**'
      - 'QuotaNotchTests/**'
      - 'boringNotch/**'
      - 'boringNotch.xcodeproj/**'
      - 'Package.swift'
      - 'scripts/package-quotanotch.sh'
      - 'scripts/sign-quotanotch.py'
      - 'scripts/**'
      - 'README*'
      - 'docs/assets/**'
      - '.github/workflows/quotanotch.yml'

permissions:
  contents: read

concurrency:
  group: quotanotch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Record toolchain and source revision
        run: |
          xcodebuild -version
          swift --version
          git rev-parse HEAD
      - name: Fixture tests (no user accounts or credentials)
        run: |
          set -o pipefail
          if ! swift test --parallel 2>&1 | tee test.log; then
            # Raw logs are not always retrievable; surface the failures as an annotation.
            summary=$(grep -E "error:|failed|XCTAssert|Fatal error" test.log | grep -v "^ *|" | awk '!seen[$0]++' | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=swift test::${summary}"
            exit 1
          fi
      - name: Render native compact UX fixtures
        run: |
          mkdir -p build/QuotaNotch-dist
          swiftc -target "$(uname -m)-apple-macos15.0" -parse-as-library QuotaNotch/Design/*.swift QuotaNotch/Core/QuotaWarning.swift QuotaNotch/Core/QuotaCompactMetrics.swift QuotaNotch/Core/QuotaLocalization.swift QuotaNotch/Core/QuotaModels.swift scripts/render-compact.swift -o build/render-compact
          build/render-compact
          swiftc -parse-as-library QuotaNotch/Design/*.swift QuotaNotch/Core/QuotaWarning.swift QuotaNotch/Core/QuotaLocalization.swift QuotaNotch/Core/QuotaModels.swift scripts/render-warning.swift -o build/render-warning
          build/render-warning
          swiftc -parse-as-library QuotaNotch/Design/*.swift QuotaNotch/Core/QuotaWarning.swift QuotaNotch/Core/QuotaLocalization.swift QuotaNotch/Core/QuotaModels.swift scripts/render-accessories.swift -o build/render-accessories
          build/render-accessories
      - name: Render original and refined proportions
        if: ${{ inputs.preview_only == true }}
        run: bash scripts/render-refinement.sh
      - name: Upload native UX preview
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Compact-UX-${{ github.sha }}
          path: build/QuotaNotch-dist/*.png
      - name: Resolve app dependencies
        if: ${{ inputs.preview_only != true }}
        run: xcodebuild -resolvePackageDependencies -project boringNotch.xcodeproj -scheme boringNotch
      - name: Build universal app
        if: ${{ inputs.preview_only != true }}
        run: |
          xcodebuild build \
            -project boringNotch.xcodeproj -scheme boringNotch \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' CODE_SIGN_IDENTITY=''
      - name: Build native task event helper
        if: ${{ inputs.preview_only != true }}
        run: |
          mkdir -p build/DerivedData/Build/Products/Release/QuotaNotch.app/Contents/Helpers
          swiftc -O -target arm64-apple-macos14.0 scripts/agent-monitor-hook.swift -o build/hook-arm64
          swiftc -O -target x86_64-apple-macos14.0 scripts/agent-monitor-hook.swift -o build/hook-x86_64
          lipo -create build/hook-arm64 build/hook-x86_64 -output build/DerivedData/Build/Products/Release/QuotaNotch.app/Contents/Helpers/QuotaNotchMonitorHook
          python3 scripts/verify-agent-hook.py build/hook-arm64
      - name: Verify compiled English and Chinese translations
        if: ${{ inputs.preview_only != true }}
        run: python3 scripts/verify-localization.py build/DerivedData/Build/Products/Release/QuotaNotch.app
      - name: Render English and Chinese usage layouts
        if: ${{ inputs.preview_only != true }}
        run: bash scripts/render-localized-usage.sh
      - name: Verify and render compiled status icon
        if: ${{ inputs.preview_only != true }}
        run: |
          swiftc -parse-as-library scripts/render-status-icon.swift -o build/render-status-icon
          build/render-status-icon build/DerivedData/Build/Products/Release/QuotaNotch.app
      - name: Package app and corresponding source
        if: ${{ inputs.preview_only != true }}
        run: bash scripts/package-quotanotch.sh
      - name: Upload installable app, source and checksums
        if: ${{ inputs.preview_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: QuotaNotch-macOS-${{ github.sha }}
          path: build/QuotaNotch-dist/*
          if-no-files-found: error
          retention-days: 30


      - name: Build isolated settings preview executable
        if: ${{ inputs.preview_only != true }}
        run: |
          xcodebuild build -quiet -project boringNotch.xcodeproj -scheme boringNotch \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=SETTINGS_PREVIEW \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM='' CODE_SIGN_IDENTITY=''
      - name: Render actual English and Chinese settings pages
        if: ${{ inputs.preview_only != true }}
        run: |
          set -o pipefail
          for lang in en zh-Hans; do
            if ! build/DerivedData/Build/Products/Release/QuotaNotch.app/Contents/MacOS/QuotaNotch -AppleLanguages "($lang)" 2>&1 | tee settings.log; then
              summary=$(grep -v "^ *$" settings.log | tail -15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=settings preview ($lang)::${summary}"
              exit 1
            fi
          done
      - name: Upload settings page screenshots
        if: ${{ always() && inputs.preview_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: Settings-UX-${{ github.sha }}
          path: build/Settings-previews/**

  publish-release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: QuotaNotch-macOS-${{ github.sha }}
          path: release-files
      - name: Publish QuotaNotch 1.06 from the verified main build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh

  # Manual branch builds become a private draft release, so the installer can be fetched
  # directly. Drafts are visible only to maintainers and never publish anything.
  test-build:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.preview_only != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QuotaNotch-macOS-${{ github.sha }}
          path: release-files
      - name: Replace the draft test build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          tag="test-$branch"
          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "Test build · $GITHUB_REF_NAME · ${GITHUB_SHA::7}" \
            --notes "Draft test build from $GITHUB_REF_NAME ($GITHUB_SHA). Not a release." \
            release-files/*.dmg
