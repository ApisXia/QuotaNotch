name: Quota refinement preview
on: workflow_dispatch
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - run: bash scripts/render-refinement.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Quota-Refinement-Comparison
          path: build/QuotaNotch-dist/Refinement-Comparison.png
